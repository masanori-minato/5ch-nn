name: build-and-deploy

on:
  # GitHub's native schedule trigger silently throttles high-frequency cron
  # (observed: */15 collapsed to ~70min avg, up to 2.5h gaps). Real 15-minute
  # cadence comes from an external service calling the workflow_dispatch API
  # instead (see README). This hourly schedule is just a fallback in case
  # that external caller goes down.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests PyYAML

      - name: Build site
        run: python build.py

      - name: Commit and push
        run: |
          git config user.name "5ch-nn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html state/threads.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update rankings [skip ci]"
            git push
          fi
